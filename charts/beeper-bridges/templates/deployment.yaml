apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beeper-bridges.fullname" . }}
  labels:
    {{- include "beeper-bridges.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One RWO volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "beeper-bridges.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beeper-bridges.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range $name, $b := .Values.bridges }}
        {{- if $b.enabled }}
        - name: {{ $name }}
          image: {{ include "beeper-bridges.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/bbctl", "run", "--no-override-config"]
          args:
            - {{ $b.bridge | default (printf "sh-mautrix-%s" $name) | quote }}
            {{- range $b.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.matrixAccessToken.existingSecret }}
                  key: {{ $.Values.matrixAccessToken.key }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "beeper-bridges.fullname" $ }}-env
          resources:
            {{- toYaml ($b.resources | default $.Values.resources) | nindent 12 }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
        {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "beeper-bridges.claimName" . }}
