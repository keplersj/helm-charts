apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beeper-bridges.fullname" . }}
  labels:
    {{- include "beeper-bridges.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One RWO volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "beeper-bridges.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beeper-bridges.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $external := dict }}
      {{- range $name, $b := .Values.externalBridges }}{{ if $b.enabled }}{{ $_ := set $external $name $b }}{{ end }}{{ end }}
      {{- if $external }}
      initContainers:
        # External bridges run as their own non-root uid; give each its private directory on the
        # shared volume (created root-owned by the subPath mount otherwise).
        - name: prepare-external
          image: {{ $.Values.initImage }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              {{- range $name, $b := $external }}
              install -d -o {{ $b.runAsUser | default 10001 }} -g {{ $b.runAsUser | default 10001 }} -m 0700 /data/external/{{ $name }}
              {{- end }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        {{- $enabled := 0 }}
        {{- range $name, $b := .Values.bridges }}{{ if $b.enabled }}{{ $enabled = add1 $enabled }}{{ end }}{{ end }}
        {{- range $name, $b := .Values.externalBridges }}{{ if $b.enabled }}{{ $enabled = add1 $enabled }}{{ if hasKey $.Values.bridges $name }}{{ fail (printf "beeper-bridges: %q is in both bridges and externalBridges" $name) }}{{ end }}{{ end }}{{ end }}
        {{- if not $enabled }}{{ fail "beeper-bridges: no bridge is enabled; set bridges.<name>.enabled=true (see the README)" }}{{ end }}
        {{- range $name, $b := .Values.externalBridges }}
        {{- if $b.enabled }}
        - name: {{ $name }}
          image: {{ include "beeper-bridges.externalImage" $b | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $b.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($b.resources | default $.Values.resources) | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ $b.runAsUser | default 10001 }}
            runAsGroup: {{ $b.runAsUser | default 10001 }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: external/{{ $name }}
            {{- if $b.configSecret }}
            - name: {{ $name }}-config
              mountPath: {{ $b.configPath | default "/data/config.yaml" }}
              subPath: {{ $b.configSecret.key | default "config.yaml" }}
              readOnly: true
            {{- end }}
        {{- end }}
        {{- end }}
        {{- range $name, $b := .Values.bridges }}
        {{- if $b.enabled }}
        - name: {{ $name }}
          image: {{ include "beeper-bridges.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/bbctl", "run", "--no-override-config"]
          args:
            - {{ $b.bridge | default (printf "sh-mautrix-%s" $name) | quote }}
            {{- range $b.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.matrixAccessToken.existingSecret }}
                  key: {{ $.Values.matrixAccessToken.key }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "beeper-bridges.fullname" $ }}-env
          resources:
            {{- toYaml ($b.resources | default $.Values.resources) | nindent 12 }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
        {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "beeper-bridges.claimName" . }}
        {{- range $name, $b := .Values.externalBridges }}
        {{- if and $b.enabled $b.configSecret }}
        - name: {{ $name }}-config
          secret:
            secretName: {{ $b.configSecret.name | required (printf "beeper-bridges: bridges.%s.configSecret.name is required" $name) }}
            defaultMode: 0444
        {{- end }}
        {{- end }}
