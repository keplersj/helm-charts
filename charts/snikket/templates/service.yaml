{{- $p := .Values.service.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "snikket.fullname" . }}
  labels:
    {{- include "snikket.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "snikket.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ $p.http }}, targetPort: http, protocol: TCP}
    - {name: https, port: {{ $p.https }}, targetPort: https, protocol: TCP}
    - {name: xmpp-c2s, port: {{ $p.xmppClient }}, targetPort: xmpp-c2s, protocol: TCP}
    - {name: xmpp-s2s, port: {{ $p.xmppServer }}, targetPort: xmpp-s2s, protocol: TCP}
    - {name: proxy65, port: {{ $p.proxy65 }}, targetPort: proxy65, protocol: TCP}
    - {name: stun, port: {{ $p.stun }}, targetPort: stun, protocol: UDP}
    - {name: stun-tcp, port: {{ $p.stun }}, targetPort: stun-tcp, protocol: TCP}
    - {name: stun-tls, port: {{ $p.stunTls }}, targetPort: stun-tls, protocol: TCP}
