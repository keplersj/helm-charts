apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snikket.fullname" . }}
  labels:
    {{- include "snikket.labels" . | nindent 4 }}
data:
  SNIKKET_DOMAIN: {{ required "snikket.domain is required" .Values.snikket.domain | quote }}
  SNIKKET_ADMIN_EMAIL: {{ required "snikket.adminEmail is required" .Values.snikket.adminEmail | quote }}
  {{- range $k, $v := .Values.snikket.env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
