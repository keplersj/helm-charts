snikket:
  # -- (required) Your Snikket domain, e.g. chat.example.com. The groups. and share. subdomains
  # must resolve to the same address.
  domain: ""
  # -- (required) Admin email; also used for Let's Encrypt.
  adminEmail: ""
  # -- Extra SNIKKET_* settings, rendered into the shared ConfigMap as-is, e.g.
  # SNIKKET_TWEAK_IPV6: "1", SNIKKET_TWEAK_TURNSERVER_PORT_RANGE: "60000-60100".
  # See https://github.com/snikket-im/snikket-server/blob/master/docs/advanced/config.md
  env: {}

image:
  registry: docker.io
  # -- Tag for all four images (they are released together). Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent
  # -- Per-component overrides: repository, tag, digest.
  server:
    repository: snikket/snikket-server
    digest: ""
  portal:
    repository: snikket/snikket-web-portal
    digest: ""
  proxy:
    repository: snikket/snikket-web-proxy
    digest: ""
  certs:
    repository: snikket/snikket-cert-manager
    digest: ""

# Workaround for coturn's TLS listeners (5349/5350) not starting. The server image writes the
# certificate to /etc/prosody/certs as prosody:prosody (0640 crt, 0400 key), which coturn's user
# (turnserver) can't read, so coturn logs "cannot find certificate file ... (1)" (EPERM).
# Enabling this starts a small loop in the server container that adds turnserver to ssl-cert,
# makes both files group-readable by ssl-cert, and restarts coturn when the certificate changes.
# Off by default; see the README.
turnCertFix:
  enabled: false
  # -- Seconds between checks. The daily refresh-certs re-import resets ownership, so this is also
  # how long the files stay unreadable (for a coturn restart) after one.
  interval: 30

# Get the certificate from cert-manager instead of the `certs` (certbot) container.
# When enabled the `certs` container and the ACME challenge volume are not rendered. cert-manager
# writes a kubernetes.io/tls Secret, which is mounted into the server and proxy containers as
# /snikket/letsencrypt/live/<domain>/{fullchain,privkey}.pem, the layout the stock certbot flow
# produces, so the unmodified images pick it up (prosody via the daily refresh-certs import, nginx
# via a reload loop this chart adds). Needs cert-manager installed. Because the pod itself serves
# port 80, use an issuer that doesn't need an Ingress/Gateway, i.e. DNS-01.
# Switching an existing install over leaves the old certbot files on the PVC; they're hidden by
# the mount and can be deleted later.
certManager:
  enabled: false
  # -- Render a Certificate for the domain, groups.<domain> and share.<domain>. Set false to use a
  # Secret you manage yourself (then set secretName); it needs tls.crt (full chain) and tls.key.
  createCertificate: true
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  # -- Secret name. Defaults to <fullname>-tls.
  secretName: ""
  # -- Override the certificate names. Default: the domain, groups.<domain>, share.<domain>.
  dnsNames: []
  # -- ASCII (punycode) form of snikket.domain, used as the directory name. Only needed for
  # internationalised domains; then also set dnsNames to the ASCII names.
  domainAscii: ""
  duration: ""
  renewBefore: ""
  # -- RSA 2048 is the most widely compatible for XMPP clients.
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  # -- Seconds between checks for a renewed certificate (to reload nginx).
  reloadInterval: 60

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

resources:
  server:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  portal:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  proxy:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
  certs:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

persistence:
  # -- Use an existing PVC (e.g. one from a previous install) instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  annotations: {}

service:
  # -- Snikket must be reachable from the internet (XMPP, HTTP for ACME, TURN), so most installs
  # set LoadBalancer (or put the pod on hostNetwork). ClusterIP is only a safe default.
  type: ClusterIP
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: ""
  # -- Ports on the Service. targetPort is the container port (the pod shares one network
  # namespace, so any container's port works). Override the whole list to match an existing
  # Service exactly, e.g. when adopting one with a load balancer IP you need to keep.
  ports:
    - {name: http, port: 80, targetPort: 80, protocol: TCP}
    - {name: https, port: 443, targetPort: 443, protocol: TCP}
    - {name: xmpp-c2s, port: 5222, targetPort: 5222, protocol: TCP}
    - {name: xmpp-s2s, port: 5269, targetPort: 5269, protocol: TCP}
    - {name: proxy65, port: 5000, targetPort: 5000, protocol: TCP}
    - {name: stun, port: 3478, targetPort: 3478, protocol: UDP}
    - {name: stun-tcp, port: 3478, targetPort: 3478, protocol: TCP}
    - {name: turn, port: 3479, targetPort: 3479, protocol: UDP}
    - {name: turn-tcp, port: 3479, targetPort: 3479, protocol: TCP}
    - {name: stun-tls, port: 5349, targetPort: 5349, protocol: TCP}
    - {name: turn-tls, port: 5350, targetPort: 5350, protocol: TCP}

# -- Run on the node's network (upstream's docker-compose does). Needed for TURN media relay
# ports, which a Service can't reasonably expose.
hostNetwork: false

nodeSelector: {}
tolerations: []
affinity: {}
