name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.7.0"
          KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
        run: |
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform && sudo install kubeconform /usr/local/bin/
      - name: Lint and validate
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            name=$(basename "$chart")
            values=("$chart"ci/*-values.yaml)
            [[ -e "${values[0]}" ]] || values=("")
            for v in "${values[@]}"; do
              args=(); [[ -n "$v" ]] && args=(-f "$v")
              echo "::group::${name} ${v:-defaults}"
              helm lint --strict "$chart" "${args[@]}"
              helm template ci "$chart" "${args[@]}" | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
              echo "::endgroup::"
            done
          done
